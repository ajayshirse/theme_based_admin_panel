<!-- Header Component -->
<header class="sticky top-0 z-20 h-[68px] bg-white/95 backdrop-blur 
               border-b border-slate-200 flex items-center gap-3 lg:gap-5 px-4 lg:px-7">

  <!-- Hamburger -->
  <button id="sidebarToggle"
    class="text-slate-600 hover:text-slate-900 hover:bg-slate-100 
           p-2 rounded-lg transition">
    <i data-lucide="menu" class="w-5 h-5"></i>
  </button>

  <!-- Search -->
  <div class="hidden sm:flex items-center h-10 max-w-md flex-1 
              bg-slate-50 border border-slate-200 rounded-lg px-3 
              focus-within:border-slate-400 transition">
    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
    <input id="globalSearch" type="text" placeholder="Search templates, websites..."
      class="w-full bg-transparent outline-none px-2 text-sm text-slate-800 
             placeholder-slate-400">
  </div>

  <div class="flex-1"></div>

  <!-- Help -->
  <button class="hidden sm:flex items-center gap-2 border border-slate-200 
                 bg-white hover:bg-slate-50 rounded-lg px-3 py-2 
                 text-sm font-medium text-slate-600 transition">
    <i data-lucide="circle-help" class="w-4 h-4"></i>
    <span>Help</span>
  </button>

  <!-- Notifications -->
  <button class="relative text-slate-600 hover:text-slate-900 
                 hover:bg-slate-100 p-2 rounded-lg transition">
    <i data-lucide="bell" class="w-5 h-5"></i>
    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full"></span>
  </button>

  <!-- Profile -->
  <div class="flex items-center gap-2 pl-3 border-l border-slate-200">
    <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 
                grid place-items-center text-sm font-semibold">
      A
    </div>
    <div class="hidden md:block leading-tight">
      <div class="text-[13px] font-semibold text-slate-800">Ajay</div>
      <div class="text-[11px] text-slate-400">Administrator</div>
    </div>
    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 hidden md:block"></i>
  </div>
</header>
